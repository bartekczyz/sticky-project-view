name: Run UI Tests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  testUI:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: xvfb-run -a ./gradlew integrationTest
          - os: windows-latest
            command: .\gradlew.bat integrationTest
          - os: macos-latest
            command: ./gradlew integrationTest

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Starter/Driver integration tests
        run: ${{ matrix.command }}

      - name: Upload test reports and IDE logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-evidence-${{ matrix.os }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            build/test-results/integrationTest/
            build/reports/tests/integrationTest/
            out/ide-tests/tests/**/log/**
            out/ide-tests/tests/**/logs/**
            out/ide-tests/tests/**/reports/**
            allure-results/
