name: Run UI Tests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  testUI:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: xvfb-run -a ./gradlew integrationTest
          - os: windows-latest
            command: .\gradlew.bat integrationTest
          - os: macos-latest
            command: |
              osascript <<'APPLESCRIPT' &
              -- Hosted macOS runners can show a native dialog that steals focus from the IDE.
              -- Deny only local-network discovery; Starter/Driver uses loopback connections.
              repeat 1800 times
                  tell application "System Events"
                      repeat with notificationProcess in (application processes whose name is "UserNotificationCenter")
                          repeat with notificationWindow in windows of notificationProcess
                              try
                                  set elements to entire contents of notificationWindow
                                  set isNetworkPrompt to false
                                  repeat with element in elements
                                      if role of element is "AXStaticText" then
                                          if (value of element as text) contains "local networks" then set isNetworkPrompt to true
                                      end if
                                  end repeat
                                  if isNetworkPrompt then
                                      repeat with element in elements
                                          if role of element is "AXButton" then
                                              if name of element is "Don’t Allow" or name of element is "Don't Allow" then
                                                  click element
                                                  exit repeat
                                              end if
                                          end if
                                      end repeat
                                  end if
                              end try
                          end repeat
                      end repeat
                  end tell
                  delay 1
              end repeat
              APPLESCRIPT
              prompt_watcher=$!
              trap 'kill "$prompt_watcher" 2>/dev/null || true; wait "$prompt_watcher" 2>/dev/null || true' EXIT
              ./gradlew integrationTest

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Starter/Driver integration tests
        run: ${{ matrix.command }}

      - name: Upload test reports and IDE logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-evidence-${{ matrix.os }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            build/test-results/integrationTest/
            build/reports/tests/integrationTest/
            out/ide-tests/tests/**/log/**
            out/ide-tests/tests/**/logs/**
            out/ide-tests/tests/**/reports/**
            allure-results/
